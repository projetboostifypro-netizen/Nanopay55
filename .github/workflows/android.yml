name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: android-actions/setup-android@v3

      # ✅ Installer Gradle 8.13 (évite le Gradle 9.x du runner)
      - name: Install Gradle 8.13
        run: |
          set -e
          curl -L -o gradle.zip https://services.gradle.org/distributions/gradle-8.13-bin.zip
          unzip -q gradle.zip -d $HOME/gradle
          echo "$HOME/gradle/gradle-8.13/bin" >> $GITHUB_PATH
          gradle -v

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses

      - name: Install Cordova
        run: npm i -g cordova

      - name: Prepare Cordova Android platform
        run: |
          cordova platform rm android || true
          cordova platform add android@12.0.1

      # ✅ Reproduire EXACTEMENT l’étape qui échoue, mais avec logs complets
      - name: Debug wrapper step (stacktrace+info)
        run: |
          set -e
          cd platforms/android
          echo "== Running wrapper.gradle with verbose logs =="
          gradle -p "$PWD" wrapper -b "$PWD/wrapper.gradle" --stacktrace --info --no-daemon

      - name: Build Debug APK (verbose)
        run: |
          cordova build android --debug -- --stacktrace --info --no-daemon

      # ✅ Uploader aussi le rapport problems (si généré)
      - name: Upload Gradle problem report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-problems-report
          path: platforms/android/build/reports/problems/**

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Nanopay-APK
          path: platforms/android/app/build/outputs/apk/debug/*.apk
