name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: android-actions/setup-android@v3

      # ✅ Installer Gradle 8.13 (au lieu du Gradle 9.x du runner)
      - name: Install Gradle 8.13
        run: |
          set -e
          curl -L -o gradle.zip https://services.gradle.org/distributions/gradle-8.13-bin.zip
          unzip -q gradle.zip -d $HOME/gradle
          echo "$HOME/gradle/gradle-8.13/bin" >> $GITHUB_PATH
          gradle -v

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"
          yes | sdkmanager --licenses

      - name: Install Cordova
        run: npm i -g cordova

      # ✅ Repartir propre + version stable
      - name: Prepare Cordova Android platform
        run: |
          cordova platform rm android || true
          cordova platform add android@12.0.1

      # ✅ Générer le wrapper avec Gradle 8.13 (évite l’appel au Gradle 9.3)
      - name: Generate Gradle wrapper (compatible)
        run: |
          cd platforms/android
          gradle wrapper --gradle-version 8.13
          ./gradlew -v

      - name: Build Debug APK
        run: |
          cordova build android --debug -- --stacktrace --info --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Nanopay-APK
          path: platforms/android/app/build/outputs/apk/debug/*.apk
