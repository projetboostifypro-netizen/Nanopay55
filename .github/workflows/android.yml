name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "platforms;android-35" \
            "build-tools;34.0.0" \
            "build-tools;35.0.0"
          yes | sdkmanager --licenses

      - name: Install Cordova
        run: npm i -g cordova

      # ✅ On repart propre + version stable
      - name: Prepare Cordova Android platform
        run: |
          cordova platform rm android || true
          cordova platform add android@12.0.1

      - name: Show requirements
        run: cordova requirements || true

      # ✅ Logs complets pour voir la VRAIE erreur
      - name: Build Debug APK (verbose)
        run: |
          set +e
          cordova build android --debug -- --stacktrace --info --no-daemon
          code=$?
          echo "Cordova build exit code: $code"
          # Affiche les logs Gradle si dispo
          if [ -f "platforms/android/app/build/outputs/logs/log.txt" ]; then
            echo "----- Gradle log (last 300 lines) -----"
            tail -n 300 platforms/android/app/build/outputs/logs/log.txt || true
          fi
          exit $code

      - uses: actions/upload-artifact@v4
        with:
          name: Nanopay-APK
          path: platforms/android/app/build/outputs/apk/debug/*.apk
