name: Build Nanopay APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: "npm"

      - run: npm install -g cordova cordova-res

      - run: |
          cordova platform add android || true
          cordova plugin add cordova-plugin-whitelist || true
          cordova plugin add cordova-plugin-splashscreen || true

      - run: cordova-res android --skip-config --copy || true

      - run: cordova build android --debug

      - uses: actions/upload-artifact@v4
        with:
          name: nanopay-apk
          path: platforms/android/app/build/outputs/apk/debug/app-debug.apk
